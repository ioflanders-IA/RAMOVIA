<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  
  <!-- App Icon Background with safe zone margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle circular grid / landscape ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2d6a4f" stroke-width="6" stroke-dasharray="12 12" opacity="0.4" />
  
  <!-- Branch & Pruning / Leaf Icon -->
  <g transform="translate(256, 256) scale(1.1) translate(-256, -256)">
    <!-- Branch stem -->
    <path d="M160 380 C 190 320, 230 270, 340 180" fill="none" stroke="#95d5b2" stroke-width="18" stroke-linecap="round" />
    
    <!-- Top Main Leaf -->
    <path d="M 340 180 C 370 120, 320 90, 260 120 C 230 140, 250 190, 340 180 Z" fill="url(#leafGrad)" stroke="#74c69d" stroke-width="4" />
    
    <!-- Left Leaf -->
    <path d="M 230 270 C 180 240, 160 180, 200 170 C 230 170, 250 220, 230 270 Z" fill="url(#leafGrad)" stroke="#74c69d" stroke-width="4" />

    <!-- Right Side Sprig / Orange Work Accent (Shears / Pruning motif) -->
    <circle cx="346" cy="180" r="16" fill="url(#accentGrad)" />
    <circle cx="200" cy="340" r="12" fill="url(#accentGrad)" />
  </g>

  <!-- Typography / Brand Lettering R -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="8" text-anchor="middle">RAMOVIA</text>
</svg>
